name: Build SunuGuard APK (debug)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunuguard-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build githubDebug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install pinned Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain for Android (wgbridge)
        run: ./scripts/setup_rust_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build githubDebug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunuGuard-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/github/debug -name '*.apk' | head -1)
          echo "APK trouve : $APK"
          gh release delete latest-debug --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-debug "$APK" \
            --repo "${{ github.repository }}" \
            --title "SunuGuard — dernier APK de test" \
            --notes "APK githubDebug genere automatiquement par GitHub Actions. Installer en autorisant les sources inconnues."
